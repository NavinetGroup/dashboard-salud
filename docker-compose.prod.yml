services:
  dashboard:
    build: .
    image: informe-regional:latest
    container_name: informe-dashboard
    expose:
      - "8501"
    volumes:
      - informe_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500M
        reservations:
          memory: 500M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - informe-net

  caddy:
    image: caddy:2.10-alpine
    container_name: informe-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ${TLS_CERT_PATH:-/dev/null}:/certs/cert.pem:ro
      - ${TLS_KEY_PATH:-/dev/null}:/certs/key.pem:ro
    environment:
      HOSTNAME: ${HOSTNAME:-informe-regional.local}
      TLS_MODE: ${TLS_MODE:-internal}
    depends_on:
      - dashboard
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - informe-net

volumes:
  informe_data:
  caddy_data:
  caddy_config:

networks:
  informe-net:
    driver: bridge
